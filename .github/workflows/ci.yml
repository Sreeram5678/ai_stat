name: CI Test Suite and Manifest Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Validate (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate Manifest V3 schema and JSON syntax
        run: npm run validate

      - name: Verify asset paths exist
        run: |
          node -e "
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('./manifest.json', 'utf8'));
            const filesToCheck = [
              manifest.action?.default_popup,
              manifest.background?.service_worker,
              ...(manifest.icons ? Object.values(manifest.icons) : []),
              ...(manifest.content_scripts ? manifest.content_scripts.flatMap(c => c.js || []) : [])
            ].filter(Boolean);

            let missing = 0;
            for (const file of filesToCheck) {
              if (!fs.existsSync(file)) {
                console.error('Missing file declared in manifest:', file);
                missing++;
              }
            }
            if (missing > 0) {
              process.exit(1);
            }
            console.log('All ' + filesToCheck.length + ' declared manifest assets verified.');
          "

      - name: Run unit tests
        run: npm run test:unit

      - name: Run test coverage
        run: npm run test:coverage
